<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotograf - Kontakt</title>
    <link rel="icon" type="image/png" href="zdjecie.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>

<body class="bg-white text-gray-800 antialiased">

    <div id="header-placeholder"></div>

    <main>
        <section class="hero-full bg-gray-900 text-white">
            <div class="absolute inset-0 bg-gradient-to-br from-gray-900 to-gray-700 opacity-90"></div>
            <div class="container mx-auto px-6 relative z-10" data-aos="fade-up" data-aos-duration="1000">
                <h1 class="text-4xl md:text-6xl font-bold mb-4">Skontaktuj Się</h1>
                <p class="text-lg md:text-xl max-w-2xl mx-auto opacity-90">
                    Chętnie dowiem się o Twoim projekcie lub odpowiem na wszelkie pytania.
                </p>
            </div>
        </section>

        <section class="py-20 bg-white">
            <div class="container mx-auto px-6 max-w-6xl">
                <div class="grid grid-cols-1 gap-12 justify-items-center">
                    <div class="p-8 bg-gray-50 rounded-lg shadow-xl w-full max-w-lg" data-aos="fade-up"
                        data-aos-duration="1000">
                        <h2 class="text-4xl font-bold mb-8 text-gray-900 text-center">Moje Dane Kontaktowe</h2>
                        <div class="space-y-6 text-lg text-gray-700 text-center">
                            <p class="flex items-center justify-center">
                                <i data-feather="mail" class="w-6 h-6 text-beige mr-4 flex-shrink-0"></i>
                                <a href="mailto:info@photographername.com"
                                    class="hover:underline">email.com</a>
                            </p>
                            <p class="flex items-center justify-center">
                                <i data-feather="phone" class="w-6 h-6 text-beige mr-4 flex-shrink-0"></i>
                                <a href="tel:+48123456789" class="hover:underline">+48 123 456 789</a>
                            </p>
                            <p class="flex items-start justify-center">
                                <i data-feather="map-pin" class="w-6 h-6 text-beige mr-4 flex-shrink-0 mt-1"></i>
                                <span>Opole, Polska</span>
                            </p>
                            <div class="flex space-x-6 pt-4 justify-center">
                                <a href="#" target="_blank"
                                    class="text-gray-700 hover:text-gray-900 transition duration-300"
                                    aria-label="Instagram">
                                    <i data-feather="instagram" class="w-8 h-8"></i>
                                </a>
                                <a href="#" target="_blank"
                                    class="text-gray-700 hover:text-gray-900 transition duration-300"
                                    aria-label="Facebook">
                                    <i data-feather="facebook" class="w-8 h-8"></i>
                                </a>
                                <a href="#" target="_blank"
                                    class="text-gray-700 hover:text-gray-900 transition duration-300"
                                    aria-label="E-mail">
                                    <i data-feather="mail" class="w-8 h-8"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="p-8 bg-gray-50 rounded-lg shadow-xl w-full" data-aos="fade-up" data-aos-duration="1000"
                        data-aos-delay="200">
                        <h3 class="text-3xl font-bold mb-6 text-gray-900 text-center">Znajdź Mnie w Opolu</h3>
                        <div class="relative overflow-hidden rounded-lg">
                            <iframe
                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d80902.7822190194!2d17.823893994905426!3d50.678890783582816!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47105306456db34b%3A0x25c66487400c346e!2sOpole!5e0!3m2!1spl!2spl!4v1763312716430!5m2!1spl!2spl"
                                width="1050" height="600" style="border:0;" allowfullscreen="true" loading="lazy"
                                referrerpolicy="no-referrer-when-downgrade"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="main.js"></script>
</body>

</html>
