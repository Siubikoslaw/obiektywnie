<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Fotograf - Portfolio</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>

<body class="bg-white text-gray-800 antialiased">

    <div id="header-placeholder"></div>

    <main>

        <section class="hero-full bg-gray-900 text-white">
            <div class="absolute inset-0 bg-gradient-to-br from-gray-900 to-gray-700 opacity-90"></div>
            <div class="container mx-auto px-6 relative z-10" data-aos="fade-up" data-aos-duration="1000">
                <h1 class="text-4xl md:text-6xl font-bold mb-4">Moje Portfolio</h1>
                <p class="text-lg md:text-xl max-w-2xl mx-auto opacity-90">
                    Wyselekcjonowana kolekcja moich prac, prezentująca różnorodne style i niezapomniane chwile.
                </p>
            </div>
        </section>

        <section class="py-16 bg-white">
            <div class="container mx-auto px-6">
                <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

                    <!-- zdjecia -->
                    <div class="gallery-item group relative overflow-hidden rounded-lg shadow-md" data-aos="zoom-in" data-aos-delay="100">
                        <img src="zdjecie.png" alt="Zdjęcie Ślubne 1" class="w-full h-72 object-cover transition-transform duration-300 group-hover:scale-105 cursor-pointer" />
                    </div>
                    <div class="gallery-item group relative overflow-hidden rounded-lg shadow-md" data-aos="zoom-in" data-aos-delay="150">
                        <img src="zdjecie.png" alt="Zdjęcie Portretowe 1" class="w-full h-72 object-cover transition-transform duration-300 group-hover:scale-105 cursor-pointer" />
                    </div>
                    <div class="gallery-item group relative overflow-hidden rounded-lg shadow-md" data-aos="zoom-in" data-aos-delay="200">
                        <img src="zdjecie.png" alt="Zdjęcie Krajobrazowe 1" class="w-full h-72 object-cover transition-transform duration-300 group-hover:scale-105 cursor-pointer" />
                    </div>

                </div>
            </div>
        </section>

        <div id="lightbox" class="lightbox-overlay" aria-hidden="true">
            <div class="lightbox-content" role="dialog" aria-modal="true">
                <button id="lightbox-close" class="lightbox-close" aria-label="Zamknij">&times;</button>
                <img id="lightbox-image" class="lightbox-image" src="" alt="">
                <p id="lightbox-caption" class="lightbox-caption"></p>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="main.js"></script>
    <script>
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-image");
        const lightboxClose = document.getElementById("lightbox-close");

        document.getElementById("gallery").addEventListener("click", (e) => {
            if (e.target.tagName === "IMG") {
                lightboxImg.src = e.target.src;
                lightbox.classList.add("active");
                document.body.style.overflow = "hidden";
            }
        });

        lightboxClose.addEventListener("click", () => {
            lightbox.classList.remove("active");
            document.body.style.overflow = "";
        });

        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove("active");
                document.body.style.overflow = "";
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                lightbox.classList.remove("active");
                document.body.style.overflow = "";
            }
        });
    </script>
</body>
</html>
